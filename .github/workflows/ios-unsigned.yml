# 未签名 iOS 构建与单测流水线（iOS 26/27 Liquid Glass）
#
# 目标：在 GitHub macos-26 runner 上验证协议一致性、运行 RainCheckTests 单元测试、
#       编译未签名 .app 并打包为 RainCheck-unsigned.ipa（全程 CODE_SIGNING_ALLOWED=NO）。
#       同时兼容仓根直接是 raincheck/ 与上层 monorepo（work/raincheck/）两种布局。

name: iOS Unsigned Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'iosApp/**'
      - 'protocol/**'
      - 'tools/check_artifacts.py'
      - '.github/workflows/ios-unsigned.yml'
      - 'work/raincheck/iosApp/**'
      - 'work/raincheck/protocol/**'
      - 'work/raincheck/tools/check_artifacts.py'
      - 'work/raincheck/.github/workflows/ios-unsigned.yml'
  pull_request:
    paths:
      - 'iosApp/**'
      - 'protocol/**'
      - 'tools/check_artifacts.py'
      - '.github/workflows/ios-unsigned.yml'
      - 'work/raincheck/iosApp/**'
      - 'work/raincheck/protocol/**'
      - 'work/raincheck/tools/check_artifacts.py'
      - 'work/raincheck/.github/workflows/ios-unsigned.yml'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: 单测并打包未签名 IPA（Liquid Glass）
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate raincheck project
        id: locate
        run: |
          set -euo pipefail
          if [ -d work/raincheck/iosApp ]; then
            echo "dir=work/raincheck" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Print Xcode & macOS toolchain info
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          sw_vers

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Strictly verify protocol/profile.json & iOS project config
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          cmp -s protocol/profile.json iosApp/Resources/protocol_profile.json || {
            echo "::error::iosApp/Resources/protocol_profile.json 与 protocol/profile.json 不一致"
            diff -u protocol/profile.json iosApp/Resources/protocol_profile.json || true
            exit 1
          }
          shasum -a 256 protocol/profile.json iosApp/Resources/protocol_profile.json
          python3 tools/check_artifacts.py ios-project --ios-dir iosApp

      - name: Generate Xcode project
        working-directory: ${{ steps.locate.outputs.dir }}/iosApp
        run: |
          set -euo pipefail
          xcodegen generate
          ls -la RainCheck.xcodeproj

      - name: Run RainCheckTests on iOS Simulator
        working-directory: ${{ steps.locate.outputs.dir }}/iosApp
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      candidates.append((runtime, d["name"], d["udid"]))
          candidates.sort(reverse=True)
          assert candidates, "No available iOS iPhone Simulator found"
          print(candidates[0][2])
          ')
          echo "Running RainCheckTests on Simulator UDID: $SIM_ID"
          # Apple Silicon (arm64) Simulator requires local zero-cert Ad-Hoc signing for TEST_HOST;
          # isolated in build-sim so the Release iphoneos .app/.ipa remains 100% unsigned.
          xcodebuild test \
            -project RainCheck.xcodeproj \
            -scheme RainCheck \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Build unsigned iphoneos Release .app
        working-directory: ${{ steps.locate.outputs.dir }}/iosApp
        run: |
          set -euo pipefail
          xcodebuild \
            -project RainCheck.xcodeproj \
            -scheme RainCheck \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA and verify zero _CodeSignature
        working-directory: ${{ steps.locate.outputs.dir }}/iosApp
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/RainCheck.app"
          test -d "$APP_PATH"
          test ! -e "$APP_PATH/_CodeSignature"
          test ! -e "$APP_PATH/embedded.mobileprovision"
          cmp -s ../protocol/profile.json "$APP_PATH/protocol_profile.json"

          rm -rf Payload RainCheck-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/RainCheck.app
          /usr/bin/zip -qry RainCheck-unsigned.ipa Payload

          python3 - RainCheck-unsigned.ipa <<'PY'
          import sys, zipfile
          ipa = sys.argv[1]
          with zipfile.ZipFile(ipa) as zf:
              names = zf.namelist()
          sig_entries = [n for n in names if "_CodeSignature" in n or n.endswith("embedded.mobileprovision")]
          print(f"IPA entries={len(names)}, signature_entries={sig_entries}")
          assert not sig_entries, f"IPA unexpectedly contains signing artifacts: {sig_entries}"
          PY
          ls -lh RainCheck-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RainCheck-unsigned-ipa
          path: ${{ steps.locate.outputs.dir }}/iosApp/RainCheck-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
