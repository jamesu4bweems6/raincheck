name: Android Unsigned Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'core/**'
      - 'cli/**'
      - 'androidApp/**'
      - 'protocol/**'
      - 'tools/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android-unsigned.yml'
      - 'work/raincheck/core/**'
      - 'work/raincheck/cli/**'
      - 'work/raincheck/androidApp/**'
      - 'work/raincheck/protocol/**'
      - 'work/raincheck/tools/**'
      - 'work/raincheck/build.gradle.kts'
      - 'work/raincheck/settings.gradle.kts'
      - 'work/raincheck/gradle.properties'
      - 'work/raincheck/gradle/**'
      - 'work/raincheck/.github/workflows/android-unsigned.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'cli/**'
      - 'androidApp/**'
      - 'protocol/**'
      - 'tools/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android-unsigned.yml'
      - 'work/raincheck/core/**'
      - 'work/raincheck/cli/**'
      - 'work/raincheck/androidApp/**'
      - 'work/raincheck/protocol/**'
      - 'work/raincheck/tools/**'
      - 'work/raincheck/build.gradle.kts'
      - 'work/raincheck/settings.gradle.kts'
      - 'work/raincheck/gradle.properties'
      - 'work/raincheck/gradle/**'
      - 'work/raincheck/.github/workflows/android-unsigned.yml'

permissions:
  contents: read

jobs:
  build-unsigned-apk:
    name: 测试、演练并构建未签名 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate raincheck project
        id: locate
        run: |
          set -euo pipefail
          if [ -d work/raincheck ]; then
            echo "dir=work/raincheck" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Prepare Gradle workspace
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          rm -f local.properties
          chmod +x gradlew

      - name: Verify protocol/profile.json sync
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          python3 tools/check_artifacts.py profile-sync --root .

      - name: Run core & CLI unit tests (--rerun + XML assertions)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          ./gradlew :core:jvmTest --rerun :cli:test --rerun --console=plain
          python3 tools/check_artifacts.py junit-xml --dir core/build/test-results/jvmTest --min-tests 20
          python3 tools/check_artifacts.py junit-xml --dir cli/build/test-results/test --min-tests 4

      - name: Build CLI dist and run full E2E demo
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          ./gradlew :cli:installDist --console=plain
          python3 tools/check_artifacts.py profile-sync --root . --check-cli-jar
          python3 tools/demo.py

      - name: Build unsigned release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          ./gradlew :androidApp:assembleRelease --console=plain

      - name: Assert unsigned (V1 + V2/V3), verify embedded profile, and archive
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          APK="androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk"
          test -f "$APK"
          python3 tools/check_artifacts.py apk-unsigned "$APK"
          python3 tools/check_artifacts.py profile-sync --root . --apk "$APK"
          mkdir -p dist
          cp "$APK" dist/RainCheck-1.0.0-unsigned.apk

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RainCheck-unsigned-apk
          path: ${{ steps.locate.outputs.dir }}/dist/RainCheck-1.0.0-unsigned.apk
          if-no-files-found: error
          retention-days: 14
