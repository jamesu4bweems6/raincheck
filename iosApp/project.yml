# XcodeGen 工程描述（iOS 端 · iOS 26/27 Liquid Glass）
#
# 用法（macOS 26 + Xcode 26/27，在 work/raincheck/iosApp 目录执行）：
#   brew install xcodegen
#   xcodegen generate
#   # Apple Silicon Simulator 运行 XCTest 使用独立 derivedData 与零证书本地 Ad-Hoc 签名（避免 AMFI SIGKILL）
#   xcodebuild -project RainCheck.xcodeproj -scheme RainCheck \
#     -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' \
#     -derivedDataPath build-sim \
#     CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO \
#     CODE_SIGN_IDENTITY="-" AD_HOC_CODE_SIGNING_ALLOWED=YES test
#   # 真机 Release 产物严格保持完全未签名（零证书、零 _CodeSignature）
#   xcodebuild -project RainCheck.xcodeproj -scheme RainCheck \
#     -configuration Release -sdk iphoneos -derivedDataPath build \
#     CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
#
# 设计约定：
#   - 仅使用系统框架（Foundation / SwiftUI / UIKit / Security / AVFoundation / CoreImage / CoreGraphics），零第三方依赖；
#   - 全程未签名（CODE_SIGNING_ALLOWED=NO），不依赖任何证书与 team；
#   - Info.plist 显式启用 NSAppTransportSecurity.NSAllowsLocalNetworking = true，
#     允许内置 mock (http://127.0.0.1:8787) 畅通，同时保持公网默认 ATS HTTPS 保护；
#   - 包含真实 XCTest 单测靶标 RainCheckTests，直接加载 protocol/vectors/qr_cases.json 与 protocol/profile.json。

name: RainCheck

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  RainCheck:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources/RainCheck
      - path: Resources/Assets.xcassets
      - path: Resources/protocol_profile.json
        buildPhase: resources

    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "雨课堂签到"
        NSCameraUsageDescription: "需要相机权限来扫描课堂签到二维码；不授权也可以用「粘贴二维码」完成签到。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    settings:
      base:
        PRODUCT_NAME: RainCheck
        PRODUCT_BUNDLE_IDENTIFIER: cn.raincheck.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"

        # 未签名构建：不需要证书、不需要 team
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""

    scheme:
      testTargets:
        - RainCheckTests

  RainCheckTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"

    dependencies:
      - target: RainCheck

    sources:
      - path: Tests/RainCheckTests
      - path: ../protocol/vectors/qr_cases.json
        buildPhase: resources
      - path: ../protocol/profile.json
        buildPhase: resources

    settings:
      base:
        PRODUCT_NAME: RainCheckTests
        PRODUCT_BUNDLE_IDENTIFIER: cn.raincheck.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
