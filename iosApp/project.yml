# RainCheck iOS 工程配置（XcodeGen）
#
# 架构：纯系统框架（Foundation / SwiftUI / UIKit / Security / AVFoundation / CoreImage / CoreGraphics）
# 规范：零第三方依赖 · Swift 5 严格并发（complete）· iOS 26/27 原生 Liquid Glass（iOS 16+ 优雅降级）· 默认完全未签名
#
# 常用命令（macOS，在 work/raincheck/iosApp 目录执行）：
#   xcodegen generate
#   # 1) iOS Simulator 运行 XCTest（独立 derivedData，使用本地零证书 Ad-Hoc 避免 Apple Silicon AMFI SIGKILL）
#   xcodebuild test -project RainCheck.xcodeproj -scheme RainCheck \
#     -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' \
#     -derivedDataPath build-sim \
#     CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO \
#     CODE_SIGN_IDENTITY="-" AD_HOC_CODE_SIGNING_ALLOWED=YES
#   # 2) 真机 Release 构建（严格未签名：零证书、零 _CodeSignature、零 embedded.mobileprovision）
#   xcodebuild build -project RainCheck.xcodeproj -scheme RainCheck \
#     -configuration Release -sdk iphoneos -derivedDataPath build \
#     CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

name: RainCheck

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  RainCheck:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources/RainCheck
      - path: Resources/Assets.xcassets
      - path: Resources/protocol_profile.json
        buildPhase: resources

    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "雨课堂签到"
        NSCameraUsageDescription: "用于扫描雨课堂签到二维码；未授权相机时仍可通过粘贴链接完成签到。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    settings:
      base:
        PRODUCT_NAME: RainCheck
        PRODUCT_BUNDLE_IDENTIFIER: cn.raincheck.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""

    scheme:
      testTargets:
        - RainCheckTests

  RainCheckTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"

    dependencies:
      - target: RainCheck

    sources:
      - path: Tests/RainCheckTests
      - path: ../protocol/vectors/qr_cases.json
        buildPhase: resources
      - path: ../protocol/profile.json
        buildPhase: resources

    settings:
      base:
        PRODUCT_NAME: RainCheckTests
        PRODUCT_BUNDLE_IDENTIFIER: cn.raincheck.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
